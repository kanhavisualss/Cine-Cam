name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          Z=$(ls *.zip | sort -V | tail -1)
          echo "Using $Z"
          unzip -q "$Z" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug -p proj
      - run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk CineCam.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CineCam.apk --title "CineCam APK" --notes "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
